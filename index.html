<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

  <div class="form-container">
    <div class="language-switcher" aria-label="">
      <button type="button" class="lang-button active" data-lang="kz" aria-pressed="true">ҚАЗ</button>      
      <button type="button" class="lang-button" data-lang="ru" aria-pressed="false">РУС</button>
      <button type="button" class="lang-button" data-lang="kg" aria-pressed="false">КЫР</button>
    </div>

    <img src="Images/logop.png">

    <!-- Текст страницы подставляется из translations.js -->
    <h2 id="form-title"></h2>
    <p id="form-text"></p>

    <form>
      <input type="text" placeholder="" required id="input-text">
      <input type="hidden" id="lang" value="kz">
      <div class="certificate-actions">
        <button class="button" type="button" id="make"></button>
        <button class="button" type="button" id="download-png"></button>
        <button class="button button-secondary" type="button" id="share-certificate"></button>
      </div>
    </form>
  </div>

  <script src="translations.js"></script>
  <script>
    const langInput = document.getElementById('lang');
    const langButtons = document.querySelectorAll('.lang-button');
    const formTitle = document.getElementById('form-title');
    const formText = document.getElementById('form-text');
    const inputText = document.getElementById('input-text');
    const submitBtn = document.getElementById('make');
    const pngBtn = document.getElementById('download-png');
    const shareBtn = document.getElementById('share-certificate');
    function setLanguage(lang) {
      const t = translations[lang];
      if (!t) return;
      langInput.value = lang;
      document.documentElement.lang = t.htmlLang;
      document.title = t.pageTitle;
      document.querySelector('.language-switcher').setAttribute('aria-label', t.languageSwitcherLabel);
      formTitle.innerHTML = t.title;
      formText.innerHTML = t.description;
      inputText.placeholder = t.placeholder;
      submitBtn.textContent = t.buttons.pdf;
      pngBtn.textContent = t.buttons.png;
      shareBtn.textContent = t.buttons.share;

      langButtons.forEach(button => {
        const isActive = button.dataset.lang === lang;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
    }

    langButtons.forEach(button => {
      button.addEventListener('click', () => setLanguage(button.dataset.lang));
    });
    setLanguage(langInput.value);
  </script>
  <script>
    const backgrounds = {
      pdf: {
        kz: "Cetificates/kz.png",
        ru: "Cetificates/ru.png",
        kg: "Cetificates/kg.png"
      },
      square: {
        kz: "Cetificates/kz-square.png",
        ru: "Cetificates/ru-square.png",
        kg: "Cetificates/kg-square.png"
      }
    };
    const messages = Object.fromEntries(
      Object.entries(translations).map(([lang, t]) => [lang, t.messages])
    );

    // Координаты сохраняют расположение ФИО из исходной PDF-версии (мм, A4 landscape).
    const pageWidthMM = 210;
    const pageHeightMM = 297;
    const textXMM = 20;
    const textYMM = 140;
    const rightMarginMM = 20;
    const maxFontSizePT = 80;
    const minFontSizePT = 35;
    const fontUrl = "Fonts/NotoSans-Regular.ttf";
    let fontBufferPromise;
    let busy = false;

    function currentDetails() {
      const lang = langInput.value;
      const name = inputText.value.trim().replace(/\s+/g, " ");
      if (!name) {
        alert(messages[lang].empty);
        inputText.focus();
        return null;
      }
      return { lang, name };
    }

    async function getFontBuffer() {
      if (!fontBufferPromise) {
        fontBufferPromise = fetch(fontUrl).then(response => {
          if (!response.ok) throw new Error("Font load failed");
          return response.arrayBuffer();
        }).catch(error => { fontBufferPromise = null; throw error; });
      }
      return fontBufferPromise;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.length; i += 0x8000) {
        binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      }
      return btoa(binary);
    }

    async function loadBackground(lang, format = "pdf") {
      const image = new Image();
      image.src = backgrounds[format][lang];
      await image.decode();
      return image;
    }

    async function loadCanvasFont() {
      const buffer = await getFontBuffer();
      if (!document.fonts.check('16px "CertificateNoto"')) {
        const face = new FontFace("CertificateNoto", buffer);
        await face.load();
        document.fonts.add(face);
      }
    }

    function fitFontSize(measure, name) {
      const maxWidth = pageWidthMM - textXMM - rightMarginMM;
      let size = maxFontSizePT;
      while (size > minFontSizePT && measure(name, size) > maxWidth) size--;
      if (measure(name, size) > maxWidth) {
        // Не обрезаем даже исключительно длинные имена.
        size = Math.max(1, size * maxWidth / measure(name, size));
      }
      return size;
    }

    // Квадратный сертификат: ФИО в 1–3 строки, в верхней части изображения.
    // Координаты и размеры указаны как доли от ширины/высоты изображения.
    const squareText = {
      x: 0.1,
      y: 0.48,
      width: 0.84,
      maxSize: 0.08,
      minSize: 0.027,
      lineHeight: 1.24,
      maxLines: 1
    };

    function splitNameIntoLines(name) {
      const words = name.trim().split(/\s+/);
      const maxLines = squareText.maxLines;
      if (words.length <= maxLines) {
        return words;
      }
      const lines = Array(maxLines).fill("");
      words.forEach((word, index) => {
        const line = Math.min(
          maxLines - 1,
          Math.floor(index * maxLines / words.length)
        );
        lines[line] += (lines[line] ? " " : "") + word;
      });
      return lines.filter(Boolean);
    }

    async function buildPNG(name, lang) {
      const [image] = await Promise.all([loadBackground(lang, "square"), loadCanvasFont()]);
      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, 0, 0);

      const width = canvas.width;
      const lines = splitNameIntoLines(name);
      const maxWidth = squareText.width * width;
      const maxSize = squareText.maxSize * width;
      let fontSize = maxSize;

      // Уменьшаем шрифт до тех пор, пока самая длинная строка не поместится.
      function fits(size) {
        ctx.font = `${size}px CertificateNoto`;
        return lines.every(line => ctx.measureText(line).width <= maxWidth);
      }
      while (fontSize > squareText.minSize * width && !fits(fontSize)) fontSize -= 1;
      if (!fits(fontSize)) {
        ctx.font = `${fontSize}px CertificateNoto`;
        const widest = Math.max(...lines.map(line => ctx.measureText(line).width));
        fontSize *= maxWidth / widest;
      }

      ctx.font = `${fontSize}px CertificateNoto`;
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const lineHeight = fontSize * squareText.lineHeight;
      const startY = squareText.y * canvas.height;
      lines.forEach((line, i) => {
        ctx.fillText(
          line, 
          canvas.width / 2, 
          startY + i * lineHeight
        );
      });
      return canvas;
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("PNG creation failed")), "image/png");
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    async function buildPDF(name, lang) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      const [image, fontBuffer] = await Promise.all([loadBackground(lang), getFontBuffer()]);
      const backgroundCanvas = document.createElement("canvas");
      backgroundCanvas.width = image.naturalWidth;
      backgroundCanvas.height = image.naturalHeight;
      backgroundCanvas.getContext("2d").drawImage(image, 0, 0);
      doc.addImage(backgroundCanvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, pageWidthMM, pageHeightMM);
      doc.addFileToVFS("CertificateNoto.ttf", arrayBufferToBase64(fontBuffer));
      doc.addFont("CertificateNoto.ttf", "CertificateNoto", "normal");
      doc.setFont("CertificateNoto", "normal");
      doc.setTextColor(255, 255, 255);
      const fontSize = fitFontSize((text, size) => {
        doc.setFontSize(size);
        return doc.getTextWidth(text);
      }, name);
      doc.setFontSize(fontSize);
      doc.text(name, textXMM, textYMM, { baseline: "middle" });
      return doc;
    }

    async function runAction(action) {
      if (busy) return;
      const details = currentDetails();
      if (!details) return;
      busy = true;
      const buttons = [submitBtn, pngBtn, shareBtn];
      buttons.forEach(button => button.disabled = true);
      try {
        if (action === "pdf") {
          const doc = await buildPDF(details.name, details.lang);
          doc.save("MK_certificate.pdf");
        } else {
          const canvas = await buildPNG(details.name, details.lang);
          const blob = await canvasToBlob(canvas);
          const filename = "MK_certificate.png";
          if (action === "png") {
            downloadBlob(blob, filename);
          } else {
            const file = new File([blob], filename, { type: "image/png" });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({ files: [file], title: "Power of One" });
              } catch (error) {
                if (error.name !== "AbortError") throw error;
              }
            } else {
              alert(messages[details.lang].unsupported);
              downloadBlob(blob, filename);
            }
          }
        }
      } catch (error) {
        console.error("Certificate generation failed:", error);
        alert(messages[details.lang].error);
      } finally {
        busy = false;
        buttons.forEach(button => button.disabled = false);
      }
    }

    submitBtn.addEventListener("click", () => runAction("pdf"));
    pngBtn.addEventListener("click", () => runAction("png"));
    shareBtn.addEventListener("click", () => runAction("share"));
    document.querySelector(".form-container form").addEventListener("submit", event => {
      event.preventDefault();
      runAction("pdf");
    });
  </script>
</body>
</html>
